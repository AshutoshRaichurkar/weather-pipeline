<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="760" height="300" rx="12" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#212121">Where pgdata actually lives on a Mac</text>

  <rect x="20" y="45" width="720" height="225" rx="10" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="36" y="67" font-size="13" font-weight="700" fill="#616161">Your Mac (macOS: no Linux kernel)</text>

  <rect x="40" y="80" width="430" height="175" rx="10" fill="#eef6ff" stroke="#64b5f6" stroke-width="2"/>
  <text x="56" y="102" font-size="13" font-weight="700" fill="#1565c0">Docker Desktop's Linux VM</text>
  <text x="56" y="120" font-size="10" fill="#1565c0">on the Mac: one big file, ~/Library/Containers/com.docker.docker/.../Docker.raw</text>

  <rect x="60" y="135" width="390" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="76" y="157" font-size="11" font-family="Menlo,Consolas,monospace" fill="#1b5e20">/var/lib/docker/volumes/</text>
  <text x="76" y="177" font-size="12" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#1b5e20">pgdata/_data/</text>
  <text x="96" y="197" font-size="11" font-family="Menlo,Consolas,monospace" fill="#2e7d32">base/  global/  pg_wal/ ...</text>
  <text x="76" y="222" font-size="11" fill="#2e7d32">named volume · reach it only through Docker</text>

  <rect x="495" y="80" width="225" height="175" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="607" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#f57f17">Mac filesystem</text>
  <text x="607" y="132" text-anchor="middle" font-size="11" font-family="Menlo,Consolas,monospace" fill="#5d4037">~/Documents/repos/</text>
  <text x="607" y="150" text-anchor="middle" font-size="11" font-family="Menlo,Consolas,monospace" fill="#5d4037">weather-pipeline/</text>
  <text x="607" y="170" text-anchor="middle" font-size="12" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#f57f17">dbt/</text>
  <text x="607" y="200" text-anchor="middle" font-size="11" fill="#f57f17">bind mount · a real folder</text>
  <text x="607" y="218" text-anchor="middle" font-size="11" fill="#f57f17">open it in Finder or VS Code</text>

  <text x="380" y="288" text-anchor="middle" font-size="11" fill="#616161">Peek inside a volume: <tspan font-family="Menlo,Consolas,monospace">docker run --rm -v pgdata:/data alpine ls /data</tspan>  ·  On a Linux server there's no VM: the path is real.</text>
</svg>
