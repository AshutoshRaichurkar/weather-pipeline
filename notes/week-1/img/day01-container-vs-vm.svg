<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="760" height="320" rx="12" fill="#ffffff"/>

  <!-- VMs -->
  <rect x="20" y="15" width="350" height="290" rx="10" fill="#fafafa" stroke="#bdbdbd"/>
  <text x="195" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#e65100">Virtual machines</text>
  <text x="195" y="62" text-anchor="middle" font-size="12" fill="#616161">each VM boots its own full OS · GBs · minutes</text>

  <rect x="35" y="95" width="98" height="36" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="84" y="118" text-anchor="middle" font-size="11" fill="#0d47a1">app + libs</text>
  <rect x="35" y="134" width="98" height="56" rx="4" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="84" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#e65100">guest OS</text>
  <text x="84" y="177" text-anchor="middle" font-size="10" fill="#e65100">own kernel</text>
  <rect x="146" y="95" width="98" height="36" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="195" y="118" text-anchor="middle" font-size="11" fill="#0d47a1">app + libs</text>
  <rect x="146" y="134" width="98" height="56" rx="4" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="195" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#e65100">guest OS</text>
  <text x="195" y="177" text-anchor="middle" font-size="10" fill="#e65100">own kernel</text>
  <rect x="257" y="95" width="98" height="36" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="306" y="118" text-anchor="middle" font-size="11" fill="#0d47a1">app + libs</text>
  <rect x="257" y="134" width="98" height="56" rx="4" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="306" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#e65100">guest OS</text>
  <text x="306" y="177" text-anchor="middle" font-size="10" fill="#e65100">own kernel</text>

  <rect x="35" y="198" width="320" height="28" rx="4" fill="#ede7f6" stroke="#7e57c2"/>
  <text x="195" y="217" text-anchor="middle" font-size="12" fill="#4527a0">hypervisor</text>
  <rect x="35" y="230" width="320" height="28" rx="4" fill="#eceff1" stroke="#90a4ae"/>
  <text x="195" y="249" text-anchor="middle" font-size="12" fill="#37474f">host OS</text>
  <rect x="35" y="262" width="320" height="28" rx="4" fill="#cfd8dc" stroke="#78909c"/>
  <text x="195" y="281" text-anchor="middle" font-size="12" fill="#263238">hardware</text>

  <!-- Containers -->
  <rect x="390" y="15" width="350" height="290" rx="10" fill="#e8f5e9" stroke="#43a047"/>
  <text x="565" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#2e7d32">Containers</text>
  <text x="565" y="62" text-anchor="middle" font-size="12" fill="#616161">share the host's kernel · MBs · seconds</text>

  <text x="565" y="98" text-anchor="middle" font-size="11" fill="#2e7d32">each is just an isolated process:</text>
  <text x="565" y="114" text-anchor="middle" font-size="11" fill="#2e7d32"><tspan font-weight="700">namespaces</tspan> = what it can see · <tspan font-weight="700">cgroups</tspan> = what it can use</text>

  <rect x="405" y="134" width="98" height="56" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-dasharray="4 3"/>
  <text x="454" y="160" text-anchor="middle" font-size="11" fill="#0d47a1">app + libs</text>
  <text x="454" y="177" text-anchor="middle" font-size="10" fill="#0d47a1">container</text>
  <rect x="516" y="134" width="98" height="56" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-dasharray="4 3"/>
  <text x="565" y="160" text-anchor="middle" font-size="11" fill="#0d47a1">app + libs</text>
  <text x="565" y="177" text-anchor="middle" font-size="10" fill="#0d47a1">container</text>
  <rect x="627" y="134" width="98" height="56" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-dasharray="4 3"/>
  <text x="676" y="160" text-anchor="middle" font-size="11" fill="#0d47a1">app + libs</text>
  <text x="676" y="177" text-anchor="middle" font-size="10" fill="#0d47a1">container</text>

  <rect x="405" y="198" width="320" height="28" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="565" y="217" text-anchor="middle" font-size="12" fill="#0d47a1">Docker Engine</text>
  <rect x="405" y="230" width="320" height="28" rx="4" fill="#eceff1" stroke="#90a4ae"/>
  <text x="565" y="249" text-anchor="middle" font-size="12" fill="#37474f">host OS · <tspan font-weight="700">one shared Linux kernel</tspan></text>
  <rect x="405" y="262" width="320" height="28" rx="4" fill="#cfd8dc" stroke="#78909c"/>
  <text x="565" y="281" text-anchor="middle" font-size="12" fill="#263238">hardware</text>
</svg>
