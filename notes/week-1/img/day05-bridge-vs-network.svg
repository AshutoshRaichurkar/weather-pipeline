<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#757575"/></marker>
  </defs>
  <rect width="760" height="330" rx="12" fill="#ffffff"/>

  <!-- Default bridge -->
  <rect x="20" y="20" width="350" height="290" rx="10" fill="#fafafa" stroke="#bdbdbd"/>
  <text x="195" y="47" text-anchor="middle" font-size="15" font-weight="700" fill="#c62828">Default bridge · no DNS</text>
  <text x="195" y="67" text-anchor="middle" font-size="12" fill="#757575">172.17.x.x · every container lands here</text>

  <rect x="45" y="95" width="125" height="42" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="107" y="121" text-anchor="middle" font-size="13" fill="#0d47a1">test container</text>
  <rect x="225" y="90" width="120" height="52" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="285" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">pg</text>
  <text x="285" y="131" text-anchor="middle" font-size="12" fill="#0d47a1">172.17.0.2</text>
  <line x1="170" y1="116" x2="222" y2="116" stroke="#757575" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#k)"/>
  <text x="196" y="108" text-anchor="middle" font-size="11" fill="#757575">by IP</text>

  <line x1="107" y1="137" x2="107" y2="183" stroke="#c62828" stroke-width="2" marker-end="url(#r)"/>
  <text x="117" y="164" font-size="12" fill="#c62828">lookup "pg"</text>
  <rect x="40" y="186" width="310" height="38" rx="6" fill="#ffebee" stroke="#c62828"/>
  <text x="195" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#c62828">✗ Name or service not known</text>

  <text x="195" y="260" text-anchor="middle" font-size="12" fill="#616161">Connecting by IP works, but the IP</text>
  <text x="195" y="277" text-anchor="middle" font-size="12" fill="#616161">changes whenever pg is recreated.</text>
  <text x="195" y="294" text-anchor="middle" font-size="12" fill="#616161">So you can't rely on it.</text>

  <!-- weather-net -->
  <rect x="390" y="20" width="350" height="290" rx="10" fill="#e8f5e9" stroke="#43a047"/>
  <text x="565" y="47" text-anchor="middle" font-size="15" font-weight="700" fill="#2e7d32">weather-net · built-in DNS</text>
  <text x="565" y="67" text-anchor="middle" font-size="12" fill="#757575">172.18.x.x · only containers you attach</text>

  <rect x="500" y="88" width="130" height="38" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <text x="565" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#f57f17">Docker DNS</text>
  <rect x="410" y="175" width="110" height="42" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="465" y="201" text-anchor="middle" font-size="14" fill="#0d47a1">ingest</text>
  <rect x="612" y="170" width="115" height="52" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="669" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">postgres</text>
  <text x="669" y="211" text-anchor="middle" font-size="12" fill="#0d47a1">172.18.0.2</text>

  <line x1="440" y1="174" x2="515" y2="129" stroke="#2e7d32" stroke-width="2" marker-end="url(#g)"/>
  <line x1="548" y1="128" x2="488" y2="173" stroke="#f57f17" stroke-width="2" marker-end="url(#g)"/>
  <line x1="520" y1="196" x2="609" y2="196" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="456" y="146" font-size="14" font-weight="700" fill="#2e7d32">①</text>
  <text x="527" y="162" font-size="14" font-weight="700" fill="#f57f17">②</text>
  <text x="557" y="189" font-size="14" font-weight="700" fill="#2e7d32">③</text>

  <text x="410" y="252" font-size="12" fill="#212121">① ingest asks: where is "postgres"?</text>
  <text x="410" y="271" font-size="12" fill="#212121">② DNS answers: 172.18.0.2</text>
  <text x="410" y="290" font-size="12" fill="#212121">③ ingest connects to postgres:5432 ✓</text>
</svg>
