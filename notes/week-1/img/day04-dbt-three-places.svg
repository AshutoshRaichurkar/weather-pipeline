<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f9a825"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker>
  </defs>
  <rect width="760" height="300" rx="12" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#212121">dbt run happens in three places</text>

  <rect x="20" y="50" width="210" height="200" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="125" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#f57f17">① Your Mac: dbt/ folder</text>
  <text x="40" y="100" font-size="11" font-family="Menlo,Consolas,monospace" fill="#5d4037">dbt_project.yml</text>
  <text x="40" y="118" font-size="11" font-family="Menlo,Consolas,monospace" fill="#5d4037">profiles.yml</text>
  <text x="40" y="136" font-size="11" font-family="Menlo,Consolas,monospace" fill="#5d4037">models/staging/*.sql</text>
  <text x="40" y="154" font-size="11" font-family="Menlo,Consolas,monospace" fill="#5d4037">models/marts/*.sql</text>
  <text x="40" y="184" font-size="11" font-family="Menlo,Consolas,monospace" fill="#2e7d32">target/  logs/</text>
  <text x="40" y="200" font-size="10" fill="#2e7d32">↑ written by dbt, appear here</text>
  <text x="125" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#f57f17">your code: edit, no rebuild</text>

  <rect x="275" y="50" width="210" height="200" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="380" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">② dbt container</text>
  <text x="380" y="94" text-anchor="middle" font-size="10" font-family="Menlo,Consolas,monospace" fill="#0d47a1">dbt-postgres:1.9 (official)</text>
  <text x="380" y="122" text-anchor="middle" font-size="11" fill="#0d47a1">has dbt-core + adapter</text>
  <text x="380" y="140" text-anchor="middle" font-size="11" fill="#0d47a1">reads models at /usr/app/dbt</text>
  <text x="380" y="158" text-anchor="middle" font-size="11" fill="#0d47a1">compiles Jinja → plain SQL</text>
  <text x="380" y="176" text-anchor="middle" font-size="11" fill="#0d47a1">sends the SQL to Postgres</text>
  <text x="380" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#0d47a1">the client: decides what to run</text>

  <rect x="530" y="50" width="210" height="200" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="635" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">③ pg container</text>
  <text x="635" y="94" text-anchor="middle" font-size="10" font-family="Menlo,Consolas,monospace" fill="#1b5e20">postgres:16</text>
  <text x="635" y="122" text-anchor="middle" font-size="11" fill="#1b5e20">executes CREATE VIEW</text>
  <text x="635" y="140" text-anchor="middle" font-size="11" fill="#1b5e20">and CREATE TABLE</text>
  <text x="635" y="166" text-anchor="middle" font-size="11" font-family="Menlo,Consolas,monospace" fill="#1b5e20">analytics_staging</text>
  <text x="635" y="184" text-anchor="middle" font-size="11" font-family="Menlo,Consolas,monospace" fill="#1b5e20">analytics_marts</text>
  <text x="635" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#1b5e20">the server: does the work</text>

  <line x1="232" y1="140" x2="272" y2="140" stroke="#f9a825" stroke-width="2" marker-start="url(#y)" marker-end="url(#y)"/>
  <text x="252" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#f57f17">mount</text>
  <line x1="487" y1="140" x2="527" y2="140" stroke="#ef6c00" stroke-width="2" marker-end="url(#o)"/>
  <text x="507" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#e65100">SQL</text>

  <text x="380" y="282" text-anchor="middle" font-size="12" fill="#616161">Mac ↔ dbt container: bind mount (two-way).  dbt → Postgres: SQL over the network.  No docker build: the image is generic.</text>
</svg>
