<svg xmlns="http://www.w3.org/2000/svg" width="760" height="265" viewBox="0 0 760 265" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
  </defs>
  <rect width="760" height="265" rx="12" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#212121">The container is disposable. The volume isn't.</text>

  <rect x="40" y="50" width="200" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="140" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">pg (first container)</text>
  <text x="140" y="96" text-anchor="middle" font-size="11" fill="#0d47a1">loads 768 rows</text>

  <rect x="290" y="56" width="180" height="50" rx="8" fill="#ffebee" stroke="#c62828" stroke-dasharray="4 3"/>
  <text x="380" y="78" text-anchor="middle" font-size="13" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#c62828">docker rm -f pg</text>
  <text x="380" y="96" text-anchor="middle" font-size="11" fill="#c62828">container + writable layer gone ✗</text>

  <rect x="520" y="50" width="200" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="620" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">pg (brand-new container)</text>
  <text x="620" y="96" text-anchor="middle" font-size="11" fill="#0d47a1">count(*) → 768 ✓</text>

  <line x1="240" y1="81" x2="287" y2="81" stroke="#c62828" stroke-width="2" marker-end="url(#r)"/>
  <line x1="470" y1="81" x2="517" y2="81" stroke="#1565c0" stroke-width="2" marker-end="url(#b)"/>
  <text x="494" y="73" text-anchor="middle" font-size="10" font-family="Menlo,Consolas,monospace" fill="#1565c0">run</text>

  <line x1="140" y1="112" x2="140" y2="160" stroke="#2e7d32" stroke-width="3"/>
  <line x1="620" y1="112" x2="620" y2="160" stroke="#2e7d32" stroke-width="3"/>
  <text x="150" y="140" font-size="10" font-family="Menlo,Consolas,monospace" fill="#2e7d32">-v pgdata:/var/lib/postgresql/data</text>
  <text x="610" y="140" text-anchor="end" font-size="10" font-family="Menlo,Consolas,monospace" fill="#2e7d32">same -v pgdata:...</text>

  <rect x="40" y="160" width="680" height="56" rx="28" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="380" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">pgdata volume · raw.hourly_weather · 768 rows</text>
  <text x="380" y="204" text-anchor="middle" font-size="11" fill="#2e7d32">lives outside any container's lifecycle</text>

  <text x="380" y="245" text-anchor="middle" font-size="12" fill="#616161">Only <tspan font-family="Menlo,Consolas,monospace">docker volume rm pgdata</tspan> (or <tspan font-family="Menlo,Consolas,monospace">compose down -v</tspan>) deletes the data.</text>
</svg>
