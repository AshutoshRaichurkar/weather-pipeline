<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="760" height="330" rx="12" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#212121">weather-ingest is a stack of layers (from docker history)</text>
  <text x="380" y="48" text-anchor="middle" font-size="12" fill="#616161">Each instruction adds one layer holding only what that step changed. Later layers sit on top.</text>

  <text x="40" y="76" font-size="11" font-weight="600" fill="#9e9e9e">INSTRUCTION</text>
  <text x="520" y="76" font-size="11" font-weight="600" fill="#9e9e9e">SIZE</text>

  <rect x="40" y="84" width="460" height="28" rx="4" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="54" y="103" font-size="12" font-family="Menlo,Consolas,monospace" fill="#757575">ENTRYPOINT ["python", "ingest.py"]</text>
  <text x="520" y="103" font-size="12" fill="#757575">0 B · settings only</text>

  <rect x="40" y="116" width="460" height="28" rx="4" fill="#e8f5e9" stroke="#43a047"/>
  <text x="54" y="135" font-size="12" font-family="Menlo,Consolas,monospace" fill="#1b5e20">COPY . .</text>
  <text x="520" y="135" font-size="12" font-weight="600" fill="#2e7d32">24.6 kB · your code</text>

  <rect x="40" y="148" width="460" height="40" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="54" y="173" font-size="12" font-family="Menlo,Consolas,monospace" fill="#0d47a1">RUN pip install -r requirements.txt</text>
  <text x="520" y="173" font-size="12" font-weight="600" fill="#1565c0">28.6 MB · packages</text>

  <rect x="40" y="192" width="460" height="28" rx="4" fill="#e8f5e9" stroke="#43a047"/>
  <text x="54" y="211" font-size="12" font-family="Menlo,Consolas,monospace" fill="#1b5e20">COPY requirements.txt .</text>
  <text x="520" y="211" font-size="12" fill="#2e7d32">12.3 kB</text>

  <rect x="40" y="224" width="460" height="28" rx="4" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="54" y="243" font-size="12" font-family="Menlo,Consolas,monospace" fill="#757575">WORKDIR /app</text>
  <text x="520" y="243" font-size="12" fill="#757575">8 kB</text>

  <rect x="40" y="256" width="460" height="54" rx="4" fill="#eceff1" stroke="#78909c"/>
  <text x="54" y="279" font-size="12" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#37474f">FROM python:3.12-slim</text>
  <text x="54" y="298" font-size="11" fill="#546e7a">many layers: Debian + Python</text>
  <text x="520" y="288" font-size="12" font-weight="700" fill="#37474f">~205 MB · 85% of the image</text>

  <text x="705" y="96" text-anchor="middle" font-size="11" fill="#9e9e9e">top</text>
  <line x1="705" y1="104" x2="705" y2="292" stroke="#bdbdbd" stroke-width="2"/>
  <text x="705" y="306" text-anchor="middle" font-size="11" fill="#9e9e9e">bottom</text>
</svg>
