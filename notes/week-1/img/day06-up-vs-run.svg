<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="760" height="320" rx="12" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#212121">Services vs. one-off jobs</text>

  <!-- up -->
  <rect x="20" y="45" width="350" height="190" rx="10" fill="#e8f5e9" stroke="#43a047"/>
  <rect x="35" y="57" width="320" height="30" rx="5" fill="#263238"/>
  <text x="195" y="77" text-anchor="middle" font-size="12" font-family="Menlo,Consolas,monospace" fill="#a5d6a7">docker compose up -d</text>
  <text x="195" y="107" text-anchor="middle" font-size="12" fill="#1b5e20">starts every service in the file, in the background</text>

  <rect x="40" y="120" width="140" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="110" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">postgres</text>
  <text x="110" y="162" text-anchor="middle" font-size="11" fill="#0d47a1">service: stays Up</text>
  <rect x="210" y="120" width="140" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-dasharray="4 3"/>
  <text x="280" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">ingest</text>
  <text x="280" y="162" text-anchor="middle" font-size="11" fill="#0d47a1">loads data, Exited (0)</text>
  <text x="195" y="210" text-anchor="middle" font-size="11" fill="#616161">ingest waits for postgres to be healthy first</text>

  <!-- run -->
  <rect x="390" y="45" width="350" height="190" rx="10" fill="#e3f2fd" stroke="#1565c0"/>
  <rect x="405" y="57" width="320" height="30" rx="5" fill="#263238"/>
  <text x="565" y="77" text-anchor="middle" font-size="12" font-family="Menlo,Consolas,monospace" fill="#90caf9">docker compose run --rm dbt run</text>
  <text x="565" y="107" text-anchor="middle" font-size="12" fill="#0d47a1">one container from the dbt service, once</text>

  <rect x="495" y="120" width="140" height="60" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="565" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">dbt</text>
  <text x="565" y="162" text-anchor="middle" font-size="11" fill="#0d47a1">runs dbt run, deleted</text>
  <text x="565" y="203" text-anchor="middle" font-size="11" fill="#0d47a1">gets network, env, mount, platform</text>
  <text x="565" y="219" text-anchor="middle" font-size="11" fill="#0d47a1">from compose.yaml · run = arguments</text>

  <!-- down -->
  <rect x="20" y="250" width="350" height="56" rx="8" fill="#fafafa" stroke="#9e9e9e"/>
  <text x="195" y="273" text-anchor="middle" font-size="12" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#424242">docker compose down</text>
  <text x="195" y="293" text-anchor="middle" font-size="11" fill="#616161">removes containers + network · pgdata kept ✓</text>
  <rect x="390" y="250" width="350" height="56" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="565" y="273" text-anchor="middle" font-size="12" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#c62828">docker compose down -v</text>
  <text x="565" y="293" text-anchor="middle" font-size="11" fill="#c62828">also deletes volumes: the data is gone ✗</text>
</svg>
