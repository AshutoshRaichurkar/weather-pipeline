<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker>
  </defs>
  <rect width="760" height="380" rx="12" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#212121">Every docker run flag has a Compose key</text>

  <text x="185" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#9e9e9e">docker run …</text>
  <text x="575" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#9e9e9e">compose.yaml</text>

  <g font-family="Menlo,Consolas,monospace" font-size="12">
    <rect x="40" y="66" width="290" height="26" rx="4" fill="#fafafa" stroke="#bdbdbd"/><text x="52" y="84" fill="#424242">--name postgres</text>
    <rect x="430" y="66" width="290" height="26" rx="4" fill="#e3f2fd" stroke="#1565c0"/><text x="442" y="84" fill="#0d47a1">services: → postgres:</text>

    <rect x="40" y="98" width="290" height="26" rx="4" fill="#fafafa" stroke="#bdbdbd"/><text x="52" y="116" fill="#424242">postgres:16  (the image)</text>
    <rect x="430" y="98" width="290" height="26" rx="4" fill="#e3f2fd" stroke="#1565c0"/><text x="442" y="116" fill="#0d47a1">image: postgres:16</text>

    <rect x="40" y="130" width="290" height="26" rx="4" fill="#fafafa" stroke="#bdbdbd"/><text x="52" y="148" fill="#424242">docker build ingest/</text>
    <rect x="430" y="130" width="290" height="26" rx="4" fill="#e3f2fd" stroke="#1565c0"/><text x="442" y="148" fill="#0d47a1">build: ./ingest</text>

    <rect x="40" y="162" width="290" height="26" rx="4" fill="#fafafa" stroke="#bdbdbd"/><text x="52" y="180" fill="#424242">-e DB_HOST=postgres</text>
    <rect x="430" y="162" width="290" height="26" rx="4" fill="#e3f2fd" stroke="#1565c0"/><text x="442" y="180" fill="#0d47a1">environment:</text>

    <rect x="40" y="194" width="290" height="26" rx="4" fill="#fafafa" stroke="#bdbdbd"/><text x="52" y="212" fill="#424242">-v pgdata:/var/lib/...</text>
    <rect x="430" y="194" width="290" height="26" rx="4" fill="#e3f2fd" stroke="#1565c0"/><text x="442" y="212" fill="#0d47a1">volumes:  (+ top-level)</text>

    <rect x="40" y="226" width="290" height="26" rx="4" fill="#fafafa" stroke="#bdbdbd"/><text x="52" y="244" fill="#424242">-p 8000:8000</text>
    <rect x="430" y="226" width="290" height="26" rx="4" fill="#e3f2fd" stroke="#1565c0"/><text x="442" y="244" fill="#0d47a1">ports:</text>

    <rect x="40" y="258" width="290" height="26" rx="4" fill="#fafafa" stroke="#bdbdbd"/><text x="52" y="276" fill="#424242">--platform linux/amd64</text>
    <rect x="430" y="258" width="290" height="26" rx="4" fill="#e3f2fd" stroke="#1565c0"/><text x="442" y="276" fill="#0d47a1">platform: linux/amd64</text>

    <rect x="40" y="290" width="290" height="26" rx="4" fill="#fafafa" stroke="#bdbdbd"/><text x="52" y="308" fill="#424242">--network weather-net</text>
    <rect x="430" y="290" width="290" height="26" rx="4" fill="#e8f5e9" stroke="#2e7d32"/><text x="442" y="308" fill="#1b5e20">automatic ✓ (nothing to write)</text>

    <rect x="40" y="322" width="290" height="26" rx="4" fill="#fafafa" stroke="#bdbdbd"/><text x="52" y="340" fill="#424242">docker network create ...</text>
    <rect x="430" y="322" width="290" height="26" rx="4" fill="#e8f5e9" stroke="#2e7d32"/><text x="442" y="340" fill="#1b5e20">automatic ✓ (&lt;project&gt;_default)</text>
  </g>

  <g stroke="#9e9e9e" stroke-width="1.5" marker-end="url(#k)">
    <line x1="332" y1="79" x2="426" y2="79"/>
    <line x1="332" y1="111" x2="426" y2="111"/>
    <line x1="332" y1="143" x2="426" y2="143"/>
    <line x1="332" y1="175" x2="426" y2="175"/>
    <line x1="332" y1="207" x2="426" y2="207"/>
    <line x1="332" y1="239" x2="426" y2="239"/>
    <line x1="332" y1="271" x2="426" y2="271"/>
    <line x1="332" y1="303" x2="426" y2="303"/>
    <line x1="332" y1="335" x2="426" y2="335"/>
  </g>
  <text x="380" y="369" text-anchor="middle" font-size="12" fill="#616161">The service name (postgres) is also its hostname on the project network, same as --name on Day 5.</text>
</svg>
