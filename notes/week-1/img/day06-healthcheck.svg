<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="760" height="330" rx="12" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#212121">"Started" is not "ready": the first seconds after docker compose up</text>

  <!-- healthy marker -->
  <line x1="435" y1="50" x2="435" y2="268" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="435" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="#2e7d32">postgres becomes healthy</text>

  <!-- row 1: postgres -->
  <text x="20" y="80" font-size="12" font-weight="700" fill="#212121">postgres</text>
  <text x="20" y="96" font-size="10" fill="#757575">container status</text>
  <rect x="150" y="68" width="285" height="34" rx="4" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="292" y="90" text-anchor="middle" font-size="12" fill="#e65100">started · initializing the database</text>
  <rect x="435" y="68" width="285" height="34" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="577" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#1b5e20">healthy ✓ accepting connections</text>
  <g font-size="10" font-family="Menlo,Consolas,monospace">
    <text x="245" y="118" text-anchor="middle" fill="#c62828">pg_isready ✗</text>
    <text x="340" y="118" text-anchor="middle" fill="#c62828">pg_isready ✗</text>
    <text x="443" y="118" fill="#2e7d32">pg_isready ✓</text>
  </g>

  <!-- row 2: plain depends_on -->
  <text x="20" y="152" font-size="12" font-weight="700" fill="#c62828">plain</text>
  <text x="20" y="168" font-size="11" font-family="Menlo,Consolas,monospace" fill="#c62828">depends_on</text>
  <rect x="170" y="140" width="110" height="34" rx="4" fill="#ffebee" stroke="#c62828"/>
  <text x="225" y="162" text-anchor="middle" font-size="12" fill="#c62828">ingest starts</text>
  <text x="292" y="155" font-size="12" font-weight="700" fill="#c62828">✗ connection fails</text>
  <text x="292" y="171" font-size="11" fill="#c62828">db still starting up</text>

  <!-- row 3: service_healthy -->
  <text x="20" y="222" font-size="12" font-weight="700" fill="#2e7d32">condition:</text>
  <text x="20" y="238" font-size="11" font-family="Menlo,Consolas,monospace" fill="#2e7d32">service_healthy</text>
  <line x1="150" y1="227" x2="430" y2="227" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="3 4"/>
  <text x="292" y="220" text-anchor="middle" font-size="11" fill="#757575">ingest waits…</text>
  <rect x="440" y="210" width="150" height="34" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="515" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#1b5e20">ingest runs ✓</text>

  <!-- axis -->
  <line x1="150" y1="270" x2="720" y2="270" stroke="#bdbdbd" stroke-width="2"/>
  <g font-size="10" fill="#9e9e9e" text-anchor="middle">
    <text x="150" y="286">0 s</text><text x="245" y="286">1 s</text><text x="340" y="286">2 s</text><text x="435" y="286">3 s</text><text x="530" y="286">4 s</text><text x="625" y="286">5 s</text><text x="720" y="286">6 s</text>
  </g>
  <text x="380" y="314" text-anchor="middle" font-size="12" fill="#616161">The healthcheck runs pg_isready every few seconds; Docker marks the container healthy once it passes.</text>
</svg>
