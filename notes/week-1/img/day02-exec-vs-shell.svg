<svg xmlns="http://www.w3.org/2000/svg" width="760" height="285" viewBox="0 0 760 285" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
  </defs>
  <rect width="760" height="285" rx="12" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#212121">docker stop sends SIGTERM to PID 1. Who is PID 1?</text>

  <rect x="310" y="42" width="140" height="34" rx="6" fill="#263238"/>
  <text x="380" y="64" text-anchor="middle" font-size="13" font-family="Menlo,Consolas,monospace" fill="#ffffff">docker stop</text>
  <path d="M330,76 C300,92 220,88 195,101" fill="none" stroke="#ef6c00" stroke-width="2" marker-end="url(#o)"/>
  <path d="M430,76 C460,92 540,88 565,101" fill="none" stroke="#ef6c00" stroke-width="2" marker-end="url(#o)"/>
  <text x="380" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#e65100">SIGTERM</text>

  <!-- exec -->
  <rect x="20" y="105" width="350" height="165" rx="10" fill="#e8f5e9" stroke="#43a047"/>
  <text x="195" y="122" text-anchor="middle" font-size="11" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#1b5e20">exec form: ["python", "ingest.py"]</text>
  <rect x="95" y="132" width="200" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="195" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">PID 1: python</text>
  <text x="195" y="171" text-anchor="middle" font-size="11" fill="#0d47a1">receives the signal itself</text>
  <text x="195" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#2e7d32">✓ shuts down cleanly, right away</text>
  <text x="195" y="240" text-anchor="middle" font-size="11" fill="#616161">closes DB connections, finishes writes</text>
  <text x="195" y="258" text-anchor="middle" font-size="11" font-weight="600" fill="#2e7d32">Use this one</text>

  <!-- shell -->
  <rect x="390" y="105" width="350" height="165" rx="10" fill="#fafafa" stroke="#bdbdbd"/>
  <text x="565" y="122" text-anchor="middle" font-size="11" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#424242">shell form: python ingest.py</text>
  <rect x="465" y="132" width="200" height="40" rx="6" fill="#eceff1" stroke="#78909c" stroke-width="2"/>
  <text x="565" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#37474f">PID 1: /bin/sh -c</text>
  <rect x="485" y="190" width="160" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="565" y="210" text-anchor="middle" font-size="12" fill="#0d47a1">python (PID 7)</text>
  <line x1="565" y1="172" x2="565" y2="187" stroke="#c62828" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="577" y="185" font-size="11" font-weight="700" fill="#c62828">✗ not passed on</text>
  <text x="565" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#c62828">✗ Docker waits 10 s, then SIGKILL</text>
  <text x="565" y="258" text-anchor="middle" font-size="11" fill="#616161">python is killed mid-work</text>
</svg>
