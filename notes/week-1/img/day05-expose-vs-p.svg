<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
  </defs>
  <rect width="760" height="350" rx="12" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#212121">EXPOSE is a sign. -p is an open door.</text>

  <!-- EXPOSE only -->
  <rect x="20" y="45" width="350" height="240" rx="10" fill="#fafafa" stroke="#bdbdbd"/>
  <text x="195" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#424242">EXPOSE 5432 only (no -p)</text>
  <text x="195" y="88" text-anchor="middle" font-size="11" font-family="Menlo,Consolas,monospace" fill="#757575">docker ps → 5432/tcp</text>

  <rect x="35" y="110" width="85" height="50" rx="6" fill="#fafafa" stroke="#9e9e9e"/>
  <text x="77" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#424242">your Mac</text>
  <text x="77" y="148" text-anchor="middle" font-size="10" fill="#757575">outside Docker</text>

  <rect x="165" y="100" width="190" height="130" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-dasharray="5 3"/>
  <text x="177" y="117" font-size="10" font-weight="600" fill="#2e7d32">weather-net</text>
  <rect x="225" y="125" width="115" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="282" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#0d47a1">postgres</text>
  <rect x="236" y="155" width="93" height="15" rx="3" fill="#fff8e1" stroke="#f9a825"/>
  <text x="282" y="166" text-anchor="middle" font-size="9" font-weight="600" fill="#f57f17">sign: port 5432</text>
  <rect x="180" y="190" width="70" height="30" rx="5" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="215" y="210" text-anchor="middle" font-size="11" fill="#0d47a1">ingest</text>
  <path d="M232,190 C240,182 245,178 248,176" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#g)"/>
  <text x="300" y="210" font-size="10" font-weight="600" fill="#2e7d32">✓ works</text>

  <line x1="120" y1="135" x2="158" y2="135" stroke="#c62828" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <text x="139" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#c62828">✗</text>
  <text x="195" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#c62828">Mac: Connection refused</text>
  <text x="195" y="273" text-anchor="middle" font-size="11" fill="#616161">The sign opens nothing.</text>

  <!-- with -p -->
  <rect x="390" y="45" width="350" height="240" rx="10" fill="#e8f5e9" stroke="#43a047"/>
  <text x="565" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">-p 5432:5432</text>
  <text x="565" y="88" text-anchor="middle" font-size="11" font-family="Menlo,Consolas,monospace" fill="#2e7d32">docker ps → 0.0.0.0:5432-&gt;5432/tcp</text>

  <rect x="405" y="110" width="85" height="50" rx="6" fill="#fafafa" stroke="#9e9e9e"/>
  <text x="447" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#424242">your Mac</text>
  <text x="447" y="148" text-anchor="middle" font-size="10" fill="#757575">outside Docker</text>

  <rect x="535" y="100" width="190" height="130" rx="8" fill="#ffffff" stroke="#43a047" stroke-dasharray="5 3"/>
  <text x="547" y="117" font-size="10" font-weight="600" fill="#2e7d32">weather-net</text>
  <rect x="595" y="125" width="115" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="652" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#0d47a1">postgres</text>
  <rect x="606" y="155" width="93" height="15" rx="3" fill="#fff8e1" stroke="#f9a825"/>
  <text x="652" y="166" text-anchor="middle" font-size="9" font-weight="600" fill="#f57f17">sign: port 5432</text>
  <rect x="525" y="128" width="16" height="16" rx="3" fill="#ef6c00"/>
  <text x="533" y="160" text-anchor="middle" font-size="9" font-weight="700" fill="#e65100">door</text>
  <rect x="550" y="190" width="70" height="30" rx="5" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="585" y="210" text-anchor="middle" font-size="11" fill="#0d47a1">ingest</text>
  <path d="M602,190 C610,182 615,178 618,176" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#g)"/>
  <text x="670" y="210" font-size="10" font-weight="600" fill="#2e7d32">✓ works</text>

  <line x1="490" y1="135" x2="592" y2="140" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="565" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#2e7d32">Mac: connects ✓</text>
  <text x="565" y="273" text-anchor="middle" font-size="11" fill="#616161">-p forwards Mac:5432 → container:5432.</text>

  <rect x="20" y="298" width="720" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="380" y="315" text-anchor="middle" font-size="12" fill="#0d47a1"><tspan font-weight="700">EXPOSE</tspan>: Dockerfile, set by the image author, documentation only.   <tspan font-weight="700">-p</tspan>: docker run, set by whoever runs it, opens the port.</text>
  <text x="380" y="331" text-anchor="middle" font-size="12" fill="#0d47a1">Containers on the same network need neither.</text>
</svg>
