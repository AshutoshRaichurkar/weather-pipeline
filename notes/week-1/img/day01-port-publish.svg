<svg xmlns="http://www.w3.org/2000/svg" width="760" height="235" viewBox="0 0 760 235" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
  </defs>
  <rect width="760" height="235" rx="12" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#212121">How ingest.py on your Mac reaches Postgres in a container</text>

  <rect x="20" y="45" width="720" height="150" rx="10" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="36" y="66" font-size="13" font-weight="600" fill="#616161">Your Mac</text>

  <rect x="45" y="100" width="170" height="54" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <text x="130" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#f57f17">ingest.py</text>
  <text x="130" y="143" text-anchor="middle" font-size="11" fill="#f57f17">runs on the Mac (venv)</text>

  <rect x="285" y="100" width="160" height="54" rx="6" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="365" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#e65100">Mac port 5432</text>
  <text x="365" y="143" text-anchor="middle" font-size="11" fill="#e65100">opened by -p</text>

  <rect x="500" y="75" width="220" height="105" rx="10" fill="#eef6ff" stroke="#64b5f6" stroke-dasharray="6 4"/>
  <text x="514" y="93" font-size="12" font-weight="600" fill="#1565c0">Docker</text>
  <rect x="525" y="100" width="175" height="54" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="612" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">pg container</text>
  <text x="612" y="143" text-anchor="middle" font-size="11" fill="#0d47a1">Postgres on its port 5432</text>

  <line x1="215" y1="127" x2="282" y2="127" stroke="#2e7d32" stroke-width="2" marker-end="url(#g)"/>
  <text x="249" y="118" text-anchor="middle" font-size="11" font-family="Menlo,Consolas,monospace" fill="#2e7d32">localhost</text>
  <line x1="445" y1="127" x2="522" y2="127" stroke="#ef6c00" stroke-width="2" marker-end="url(#o)"/>
  <text x="483" y="118" text-anchor="middle" font-size="11" fill="#e65100">forwards</text>

  <text x="380" y="220" text-anchor="middle" font-size="13" fill="#212121"><tspan font-family="Menlo,Consolas,monospace" font-weight="700">-p 5432:5432</tspan>  =  <tspan fill="#e65100">Mac port</tspan> : <tspan fill="#1565c0">container port</tspan>.  Without -p, nothing on the Mac listens on 5432.</text>
</svg>
