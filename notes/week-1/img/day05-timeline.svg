<svg xmlns="http://www.w3.org/2000/svg" width="760" height="145" viewBox="0 0 760 145" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="760" height="145" rx="12" fill="#ffffff"/>
  <line x1="80" y1="50" x2="680" y2="50" stroke="#bdbdbd" stroke-width="3"/>

  <circle cx="80" cy="50" r="24" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="80" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">2</text>
  <text x="80" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#212121">host.docker.internal</text>
  <text x="80" y="115" text-anchor="middle" font-size="11" fill="#616161">temporary workaround</text>

  <circle cx="230" cy="50" r="24" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="230" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">4</text>
  <text x="230" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#212121">pgdata volume</text>
  <text x="230" y="115" text-anchor="middle" font-size="11" fill="#616161">safe to delete and</text>
  <text x="230" y="130" text-anchor="middle" font-size="11" fill="#616161">rename containers</text>

  <circle cx="380" cy="50" r="30" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="380" y="57" text-anchor="middle" font-size="17" font-weight="700" fill="#1b5e20">5</text>
  <text x="380" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">weather-net + names</text>
  <text x="380" y="115" text-anchor="middle" font-size="11" fill="#616161">replaces the workaround</text>
  <text x="380" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#2e7d32">(today)</text>

  <circle cx="530" cy="50" r="24" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
  <text x="530" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#616161">6</text>
  <text x="530" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#212121">Compose</text>
  <text x="530" y="115" text-anchor="middle" font-size="11" fill="#616161">creates the network and</text>
  <text x="530" y="130" text-anchor="middle" font-size="11" fill="#616161">names automatically</text>

  <circle cx="680" cy="50" r="24" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
  <text x="680" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#616161">8</text>
  <text x="680" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#212121">API</text>
  <text x="680" y="115" text-anchor="middle" font-size="11" fill="#616161">the one service</text>
  <text x="680" y="130" text-anchor="middle" font-size="11" fill="#616161">that uses -p</text>
</svg>
