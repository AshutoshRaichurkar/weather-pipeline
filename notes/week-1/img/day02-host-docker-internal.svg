<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
  </defs>
  <rect width="760" height="290" rx="12" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#212121">Why the container needed DB_HOST=host.docker.internal</text>

  <rect x="20" y="45" width="720" height="225" rx="10" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="36" y="66" font-size="13" font-weight="600" fill="#616161">Your Mac</text>

  <rect x="40" y="80" width="680" height="110" rx="10" fill="#eef6ff" stroke="#64b5f6" stroke-dasharray="6 4"/>
  <text x="56" y="100" font-size="12" font-weight="600" fill="#1565c0">Docker</text>

  <rect x="70" y="112" width="200" height="62" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="170" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">weather-ingest</text>
  <text x="170" y="157" text-anchor="middle" font-size="11" fill="#0d47a1">its localhost = itself</text>

  <rect x="500" y="112" width="200" height="62" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="600" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">pg</text>
  <text x="600" y="157" text-anchor="middle" font-size="11" fill="#0d47a1">Postgres :5432</text>

  <path d="M150,112 C150,80 110,80 110,108" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <text x="290" y="128" font-size="11" font-weight="600" fill="#c62828">✗ no DB_HOST → localhost:5432</text>
  <text x="290" y="144" font-size="11" fill="#c62828">→ nothing here → Connection refused</text>

  <rect x="300" y="210" width="170" height="46" rx="6" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="385" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">Mac port 5432</text>
  <text x="385" y="247" text-anchor="middle" font-size="11" fill="#e65100">host.docker.internal</text>

  <path d="M200,174 C220,230 260,233 297,233" fill="none" stroke="#ef6c00" stroke-width="2" marker-end="url(#o)"/>
  <text x="135" y="225" text-anchor="middle" font-size="11" font-weight="600" fill="#e65100">✓ DB_HOST=</text>
  <text x="135" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#e65100">host.docker.internal</text>
  <path d="M470,233 C540,233 600,220 600,177" fill="none" stroke="#ef6c00" stroke-width="2" marker-end="url(#o)"/>
  <text x="625" y="232" text-anchor="middle" font-size="11" fill="#e65100">-p forwards it in</text>
</svg>
