<svg xmlns="http://www.w3.org/2000/svg" width="760" height="285" viewBox="0 0 760 285" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
  </defs>
  <rect width="760" height="285" rx="12" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#212121">Secrets stay in .env; compose.yaml only names them</text>

  <rect x="20" y="50" width="220" height="110" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="130" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#c62828">.env</text>
  <text x="130" y="92" text-anchor="middle" font-size="11" fill="#c62828">git-ignored · never committed</text>
  <text x="130" y="122" text-anchor="middle" font-size="12" font-family="Menlo,Consolas,monospace" fill="#212121">POSTGRES_PASSWORD=</text>
  <text x="130" y="140" text-anchor="middle" font-size="12" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#c62828">s3cret-local</text>

  <rect x="270" y="50" width="220" height="110" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="380" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">compose.yaml</text>
  <text x="380" y="92" text-anchor="middle" font-size="11" fill="#2e7d32">committed · safe to share</text>
  <text x="380" y="122" text-anchor="middle" font-size="12" font-family="Menlo,Consolas,monospace" fill="#212121">POSTGRES_PASSWORD:</text>
  <text x="380" y="140" text-anchor="middle" font-size="12" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#2e7d32">${POSTGRES_PASSWORD}</text>

  <rect x="520" y="50" width="220" height="110" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="630" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">container</text>
  <text x="630" y="92" text-anchor="middle" font-size="11" fill="#0d47a1">at docker compose up</text>
  <text x="630" y="122" text-anchor="middle" font-size="12" font-family="Menlo,Consolas,monospace" fill="#212121">POSTGRES_PASSWORD=</text>
  <text x="630" y="140" text-anchor="middle" font-size="12" font-family="Menlo,Consolas,monospace" font-weight="700" fill="#0d47a1">s3cret-local</text>

  <line x1="240" y1="105" x2="267" y2="105" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#g)"/>
  <line x1="490" y1="105" x2="517" y2="105" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="380" y="180" text-anchor="middle" font-size="12" fill="#616161">Compose reads .env automatically and fills in every ${VAR}.</text>

  <rect x="20" y="195" width="345" height="72" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="192" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#f57f17">.env.example (committed)</text>
  <text x="192" y="238" text-anchor="middle" font-size="12" font-family="Menlo,Consolas,monospace" fill="#212121">POSTGRES_PASSWORD=change-me</text>
  <text x="192" y="257" text-anchor="middle" font-size="11" fill="#f57f17">shows which variables exist · cp .env.example .env</text>

  <rect x="395" y="195" width="345" height="72" rx="8" fill="#fafafa" stroke="#9e9e9e"/>
  <text x="567" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#424242">Check what Compose will use</text>
  <text x="567" y="238" text-anchor="middle" font-size="12" font-family="Menlo,Consolas,monospace" fill="#212121">docker compose config</text>
  <text x="567" y="257" text-anchor="middle" font-size="11" fill="#616161">prints the file with every ${VAR} filled in</text>
</svg>
